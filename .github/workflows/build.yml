name: Admin library package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: '8.0.x'
    - name: Run offline contract checks
      run: dotnet run --project tests -c Release -p:TreatWarningsAsErrors=true
    - name: Pack library
      run: |
        dotnet pack MrG.Daemon.Admin.csproj -c Release -o dist -p:TreatWarningsAsErrors=true -p:PackageVersion=1.0.0-ci.${{ github.run_number }} -p:ContinuousIntegrationBuild=true
        echo "$GITHUB_SHA" > dist/BUILD-COMMIT.txt
        (cd dist && sha256sum ./*.nupkg > SHA256SUMS.txt)
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: MrG-Daemon-Admin-NuGet
        BUILD_PATHS: dist/*
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write
